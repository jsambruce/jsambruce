<title id="title">John Sam-Bruce — Networks people can depend on</title>
<desc id="description">CCNA certified. Network engineering, resilience, availability, and security. A conceptual packet animation: the primary link is interrupted, traffic takes the alternate path, and the primary path is restored. This illustration does not represent measured network performance.</desc>
